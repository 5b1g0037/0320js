<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript作業</title>
    <style>
        body {
            background-color:  #f6f8f6; /* 設定整個頁面的背景顏色 */
            margin: 0;
            padding: 0;
          }
        div#myId {
            display: inline-block;
            background-color: rgb(217, 221, 224);
            padding: 10px;
            margin-top: 20px;
        }
        table, tr,  td {
            border: 1px solid rgb(218, 168, 168);
            border-collapse: collapse;
        }
        table{
            text-align: center;
            margin: 0 auto;
        }
        td {
            padding: 5px;
            text-align: center;
        }
        a{
            color: rgb(42, 26, 26);
            background-color: rgb(172, 163, 146);
            text-decoration: none;
            padding: 10px;
            border: 2px solid rgb(13, 41, 100);
        }
    </style>
    <script>
        function myFunciton() {
            var n = document.getElementById('numberInput').value;
            //alert("輸入的數值是:" + n);

            var str = "<table>";

            for (let i = 1; i <= n; i++) {
                str+="<tr>";
                for (let j = 1; j <= n; j++) {
                    str+=`<td> ${i} * ${j} = ${i*j}</td>`;
                }
                str+="</tr>";
            }
            str+="</table>";

            document.getElementById("myId").innerHTML = str;
        }
    </script>
</head>

<body>
    <a href ="index.html">回首頁</a> <!-- 回首頁 -->
    <h1>N*N乘法表</h1>
    <label for="numberInput">輸入一個數值:</label>
    <input type="number" id="numberInput" placeholder="輸入一個數值"/>
    <input type="button" value="OK" title="OK" onclick="myFunciton()"/>
    <div id="myId"></div>
</body>

</html>
