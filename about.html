<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>關於我的資訊</title>
  <style>
    body {
      background-color: #f6f8f6; /* 整個頁面背景顏色 */
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif; /* 字型 */
    }
    .container {
      position: relative; /* 相對定位 */
      display: flex;
      flex-direction: column; /* 垂直排列 */
      padding: 30px; /* 內邊距 */
      max-width: 850px; /* 寬度 */
      margin: 0 auto; /* 置中 */
      background-color: #deecef; /* 背景顏色 */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* 陰影效果 */
      border-radius: 10px; /* 圓角 */
    }
    .info-box {
      display: flex;
      justify-content: space-between; /* 文字靠左 */
      align-items: center; /* 垂直置中 */
      gap: 20px; /* 調整文字與其他內容的間距 */
    }
    .text-content {
      text-align: left; /* 文字靠左對齊 */
      margin-left: 80px; /* 調整文字與容器左邊的距離 */
    }
    a {
      display: inline-block;
      margin: 5px;  /* 連結之間的邊距 */
      color: #b1a1ca; /* 連結文字顏色 */
      font-weight: bold;  /*粗體 */
    }
    .profile-image {
      position: absolute; /* 圖片為絕對定位 */
      top: 80px; /* 距離容器頂部10px */
      right: 100px; /* 距離容器右側10px */
      width: 190px; /* 圖片寬度 */
      height: 250px; /* 圖片高度 */
      object-fit: cover; /* 確保圖片內容適配容器 */
      border-radius: 15px; /* 圓角效果 */
    }
    h2 {
      text-align: left; /* 標題靠左對齊 */
      margin: 8px 0; /* 調整標題上下間距 */
      line-height: 1.5; /* 調整標題行距 */
    }
    ul {
      padding: 0; /* 移除內部間距 */
      margin: 8px 0; /* 調整列表的上下間距 */
      list-style-type: disc; /* 恢復列表符號為圓點 */
    }
    li {
      margin: 3px 0; /* 調整列表項的上下間距 */
      line-height: 1.6; /* 調整列表項的行距 */
    }
  </style>
</head>
<body>
  <a href="index.html">回首頁</a> <!-- 回首頁 -->
  <div class="container">
    <!-- 圖片放在右上角 -->
    <img src="我.jpg" alt="個人照片" class="profile-image" />
    <div class="info-box">
      <!-- 文字靠左 -->
      <div class="text-content">
        <h2>個人資料</h2>
        <ul>
          <li>姓名: 王淮錡</li>
          <li>性別: 女</li>
          <li>生日: 2007/07/12</li>
          <li>星座: 巨蟹座</li>
          <li>興趣: 打排球或羽球</li>
        </ul>
        <h2>學校</h2>
        <ul>
          <li>就讀: 南台科技大學</li>
          <li>科系: 資訊工程系</li>
        </ul>
        <h2>聯絡方式</h2>
        <ul>
          <li>電話: 0972-733-312</li>
          <li>Email: <a href="mailto:aa0972733312@gmail.com">aa0972733312@gmail.com</a></li>
        </ul>
        <h2>其他</h2>
        <ul>
          <li>愛好: 聽音樂、做手作、打球</li>
          <li>目標: 找到一份穩定工作、到世界各地玩</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
