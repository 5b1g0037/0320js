<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>關於我的資訊</title>
  <style>
    body {
        background-color: #f6f8f6; /* 設定整個頁面的背景顏色 */
        margin: 0;
        padding: 0;
      }
      .container {
        display: flex;
        gap: 20px;
        padding: 20px;
      }

    .info-box {
      border: 2px solid #18392e;
      border-radius: 40px;
      background-color: #d8f1ed;
      padding: 30px;
      font-family: Arial, sans-serif;
      font-size: 20px;
      width: 30%;
    }

    .image-box img {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto;
    }
    .circle-image {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        object-fit: cover;
        padding: 80px; /* 調整圖片內容與邊框之間的距離 */
      }
      a{
        color: rgb(42, 26, 26);
        background-color: rgb(172, 163, 146);
        text-decoration: none;
        padding: 10px;
        border: 2px solid rgb(13, 41, 100);
    }

  </style>
</head>
<body>
    <a href ="index.html">回首頁</a> <!-- 回首頁 -->
  <div class="container">
    <div class="info-box">
        <h1>關於我</h1>
      <p>姓名: 王淮錡</p>
      <p>性別: 女</p>
      <p>生日: 2007/07/12</p>
      <p>星座: 巨蟹座</p>
      <p>興趣: 打排球或羽球</p>
      <p>就讀: 南台科技大學</p>
      <p>科系: 資訊工程系</p>
      <p>養了一隻蠢狗叫: 乾乾</p>
      <p>夢想是希望能走遍全世界</p>
    </div>
    <div class="image-box">
      <img src="乾乾.jpg" alt="乾乾的照片"class="circle-image"/>
    </div>
  </div> 
</body>
</html>
